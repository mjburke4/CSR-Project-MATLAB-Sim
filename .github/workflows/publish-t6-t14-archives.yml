name: Transport authorized Tranches 6–14 original archives

on:
  push:
    branches:
      - agent/t6-t14-checkpoint

permissions:
  contents: read

concurrency:
  group: transport-authorized-t6-t14-archives
  cancel-in-progress: false

jobs:
  upload-archives:
    if: >-
      github.repository == 'mjburke4/CSR-Project-MATLAB-Sim' &&
      github.ref == 'refs/heads/agent/t6-t14-checkpoint' &&
      contains(github.event.head_commit.message, 'T6_T14_TRANSPORT_READY')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out exact authorized transport commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Verify and upload three exact original archive Git blobs
        run: python3 .publication-t6-t14/upload_archives.py --upload
        env:
          GITHUB_TOKEN: ${{ github.token }}
